<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Daily OS</title>
<meta name="description" content="Daily priorities, habits, projects and journaling — a personal control panel." />
<meta name="theme-color" content="#080B11" />
<meta name="color-scheme" content="dark" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Daily OS" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<style>
  :root{
    --bg:#080B11; --panel:#0D131C; --panel2:#121A25; --well:#0A0F16; --line:#1E2A38; --line2:#27364A;
    --ink:#E8EEF6; --mute:#8593A7; --faint:#5A667C;
    --cyan:#22D3EE; --violet:#A78BFA; --amber:#FBBF24;
    --emerald:#34D399; --teal:#2DD4BF; --rose:#FB7185;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Roboto,sans-serif;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
    --tabh:62px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg);color-scheme:dark;scroll-padding-top:calc(96px + var(--sat));scroll-padding-bottom:calc(var(--tabh) + var(--sab) + 24px)}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;touch-action:manipulation;
    overscroll-behavior-y:none;padding-bottom:calc(var(--tabh) + var(--sab) + 24px)}
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;-webkit-user-select:none;user-select:none}
  button:disabled{opacity:.3;cursor:default}
  input,textarea,select{font:inherit;color:var(--ink);outline:none}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  svg{flex-shrink:0}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
  ::selection{background:#22D3EE44}

  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 var(--ac)}100%{box-shadow:0 0 0 18px transparent}}
  .enter{animation:fadeUp .35s cubic-bezier(.2,.7,.3,1) both}
  .pop{animation:pop .35s cubic-bezier(.3,1.4,.5,1)}

  .bg-glow{position:fixed;inset:0;pointer-events:none;z-index:-1;
    background:
      radial-gradient(700px 380px at 85% -10%, #22D3EE14, transparent 60%),
      radial-gradient(600px 420px at -10% 110%, #A78BFA12, transparent 60%),
      linear-gradient(#1E2A381a 1px, transparent 1px),
      linear-gradient(90deg,#1E2A381a 1px, transparent 1px);
    background-size:auto,auto,44px 44px,44px 44px}

  .wrap{max-width:1080px;margin:0 auto;padding:0 calc(16px + var(--sar)) 0 calc(16px + var(--sal))}

  /* ── top bar ── */
  .top{position:sticky;top:0;z-index:20;padding-top:var(--sat);
    background:linear-gradient(180deg,#080B11f2 60%,#080B1100);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .top-in{display:flex;align-items:center;gap:12px;padding:14px 0 12px}
  .top-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
  .top-title{margin:2px 0 0;font-size:26px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
  .mini-ring{position:relative;width:44px;height:44px;margin-left:auto;flex-shrink:0}
  .mini-ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 11px var(--mono)}

  /* ── tab bar ── */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;
    padding:6px calc(8px + var(--sar)) calc(6px + var(--sab)) calc(8px + var(--sal));
    background:#0B1018d9;-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
    border-top:1px solid #ffffff10}
  .tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;
    color:var(--faint);font-size:10.5px;font-weight:600;letter-spacing:.02em;transition:color .2s}
  .tab .ti{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:99px;transition:background .25s}
  .tab.on{color:var(--ink)}
  .tab.on .ti{background:#22D3EE1f;color:var(--cyan)}
  .tab .badge{position:absolute;top:5px;left:calc(50% + 10px);width:8px;height:8px;border-radius:9px;background:var(--amber);box-shadow:0 0 0 2px #0B1018}
  @media(min-width:760px){
    .tabs{left:50%;right:auto;bottom:calc(14px + var(--sab));transform:translateX(-50%);width:460px;border-radius:22px;
      border:1px solid #ffffff14;padding:6px;box-shadow:0 20px 50px -20px #000}
  }

  /* ── layout ── */
  .stack{display:flex;flex-direction:column;gap:14px}
  .cols{display:grid;gap:14px;align-items:start}
  @media(min-width:900px){.cols-2{grid-template-columns:1fr 1fr}.cols-3{grid-template-columns:1fr 1fr 1fr}}

  /* ── cards ── */
  .card{--ac:var(--cyan);position:relative;border-radius:22px;padding:16px;
    background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    box-shadow:inset 0 1px 0 #ffffff08,0 22px 44px -34px color-mix(in srgb,var(--ac) 60%,transparent)}
  .card::before{content:"";position:absolute;top:0;left:22px;right:22px;height:1px;
    background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ac) 55%,transparent),transparent)}
  .ch{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:30px}
  .ch-ic{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;font-size:15px;
    background:color-mix(in srgb,var(--ac) 14%,transparent);border:1px solid color-mix(in srgb,var(--ac) 28%,transparent)}
  .ch-t{font-size:16px;font-weight:650;letter-spacing:-.01em}
  .ch-s{font-size:12px;color:var(--faint);margin-top:1px}
  .ch-r{margin-left:auto;font:700 13px var(--mono);color:var(--ac);white-space:nowrap}
  .ch-meter{height:4px;border-radius:9px;background:var(--well);overflow:hidden;margin:-4px 0 12px}
  .ch-meter i{display:block;height:100%;border-radius:9px;background:var(--ac);box-shadow:0 0 10px var(--ac);transition:width .5s}

  /* ── rows ── */
  .list{display:flex;flex-direction:column;gap:8px}
  .row{--ac:var(--cyan);position:relative;display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 4px 8px 2px;
    border-radius:15px;background:var(--well);border:1px solid var(--line);transition:background .2s,border-color .2s;cursor:pointer}
  .row.done{background:color-mix(in srgb,var(--ac) 8%,var(--well));border-color:color-mix(in srgb,var(--ac) 32%,transparent)}
  .row.slim{min-height:46px}
  .row-main{flex:1;min-width:0}
  .lb{display:block;font-size:15px;font-weight:520;overflow-wrap:anywhere}
  .row.done .lb{color:var(--mute);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ac) 70%,transparent)}
  .sub{display:block;font-size:12.5px;color:var(--faint);margin-top:2px;overflow-wrap:anywhere}
  .emo{font-size:17px;width:22px;text-align:center;flex-shrink:0;transition:filter .2s}
  .row:not(.done) .emo{filter:grayscale(.35) opacity(.8)}
  .dotm{width:8px;height:8px;margin:0 7px;border-radius:9px;background:var(--ac);box-shadow:0 0 8px var(--ac);flex-shrink:0}
  .chk{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:26px;height:26px;border-radius:8px;
    border:2px solid var(--faint);transition:all .2s;font:700 11px var(--mono);color:var(--faint)}
  .chk.round{border-radius:99px}
  .row.done .chk{background:var(--ac);border-color:var(--ac);box-shadow:0 0 14px color-mix(in srgb,var(--ac) 60%,transparent)}
  .chk path{stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .35s cubic-bezier(.65,0,.35,1)}
  .row.done .chk path{stroke-dashoffset:0}
  .grip{display:flex;align-items:center;justify-content:center;width:22px;align-self:stretch;margin:-8px 0;color:var(--faint);
    opacity:.55;cursor:grab;touch-action:none;flex-shrink:0}
  .grip:active{cursor:grabbing}
  .ib{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;color:var(--faint);flex-shrink:0}
  .ib:active{background:#ffffff0d}
  .ib.sm{width:32px;height:32px}
  .ib.bd{border:1px solid var(--line);color:var(--mute)}
  .ib.ac{border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);color:var(--ac)}
  @media(hover:hover){
    .grip{opacity:0;transition:opacity .15s}
    .row:hover .grip,.proj:hover .grip{opacity:.7}
    .row:hover{border-color:var(--line2)}
    .ib:hover{background:#ffffff0d;color:var(--ink)}
  }
  .dragging{z-index:40;opacity:.96;box-shadow:0 18px 40px -10px #000c,0 0 0 1px var(--cyan)!important;transition:none!important;cursor:grabbing}
  .drop-before{box-shadow:0 -3px 0 0 var(--cyan)}
  .drop-after{box-shadow:0 3px 0 0 var(--cyan)}
  .dragover{outline:2px dashed var(--cyan)!important;outline-offset:2px}

  /* ── inputs ── */
  .add{display:flex;gap:8px;margin-top:10px}
  .inp{flex:1;min-width:0;width:100%;height:46px;border-radius:13px;padding:0 14px;font-size:16px;background:var(--well);
    border:1px dashed var(--line2);transition:border-color .2s}
  .inp:focus{border-style:solid;border-color:color-mix(in srgb,var(--ac,var(--cyan)) 60%,transparent)}
  textarea.inp{height:auto;padding:12px 14px;resize:none;line-height:1.45}
  .inp::placeholder{color:var(--faint)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 16px;border-radius:13px;
    font-size:15px;font-weight:650;color:var(--ac,var(--cyan));background:color-mix(in srgb,var(--ac,var(--cyan)) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--ac,var(--cyan)) 38%,transparent);white-space:nowrap}
  .btn:active{transform:scale(.97)}
  .btn.solid{background:var(--ac,var(--cyan));color:#061018;border-color:transparent}
  .btn.block{width:100%}
  .chip{--ac:var(--mute);display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:99px;font-size:13px;
    font-weight:600;color:var(--mute);border:1px solid var(--line);white-space:nowrap;position:relative}
  .chip.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent);border-color:color-mix(in srgb,var(--ac) 45%,transparent)}
  .chip .x{display:flex;align-items:center;justify-content:center;width:18px;height:18px;margin-right:-6px;border-radius:9px;background:#ffffff14}
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
  .chips::-webkit-scrollbar{display:none}
  .chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
  .empty{margin:0;padding:14px 0;text-align:center;font-size:13px;color:var(--faint)}
  .mono{font-family:var(--mono)}
  .muted{color:var(--mute)}.faint{color:var(--faint)}
  .note{font-size:13px;color:var(--faint);line-height:1.5;margin:-4px 0 12px}

  input[type=range]{--ac:var(--cyan);--v:50%;-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:30px;background:transparent;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:9px;background:linear-gradient(90deg,var(--ac) var(--v),#162030 var(--v))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:#F4F8FC;
    box-shadow:0 0 0 5px color-mix(in srgb,var(--ac) 28%,transparent),0 2px 6px #000a}
  input[type=range]::-moz-range-track{height:6px;border-radius:9px;background:#162030}
  input[type=range]::-moz-range-progress{height:6px;border-radius:9px;background:var(--ac)}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#F4F8FC;box-shadow:0 0 0 5px color-mix(in srgb,var(--ac) 28%,transparent)}

  /* ── hero ── */
  .hero{display:flex;align-items:center;gap:18px}
  .ring{position:relative;flex-shrink:0}
  .ring-v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring-v b{font:800 30px var(--mono);letter-spacing:-.03em;line-height:1}
  .ring-v small{font:600 9.5px var(--mono);letter-spacing:.16em;color:var(--mute);margin-top:4px}
  .ring.pulse{border-radius:50%;animation:pulse 1s ease-out}
  .streak{display:flex;align-items:baseline;gap:8px}
  .streak b{font:800 40px var(--mono);letter-spacing:-.04em;line-height:1;color:var(--amber);text-shadow:0 0 22px #FBBF2455}
  .streak span{font-size:14px;color:var(--mute)}
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .pill{font:600 12px var(--mono);padding:5px 9px;border-radius:99px;background:var(--well);border:1px solid var(--line);color:var(--mute)}
  .pill b{color:var(--ink)}
  .hero-status{display:flex;align-items:center;gap:10px;margin-top:14px;padding:11px 13px;border-radius:14px;font-size:14px;
    background:color-mix(in srgb,var(--ac) 9%,var(--well));border:1px solid color-mix(in srgb,var(--ac) 25%,transparent)}
  .hero-status .dotm{margin:0}
  .quote{margin:0;font-size:15px;line-height:1.55;font-style:italic}

  /* ── timer ── */
  .timer{display:flex;align-items:center;gap:8px;margin-top:8px}
  .timer b{font:700 15px var(--mono);color:var(--teal);min-width:44px}
  .tbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;font-size:13px;font-weight:650;
    color:var(--teal);border:1px solid #2DD4BF55;background:#2DD4BF12;white-space:nowrap}

  /* ── academic ── */
  .ac-row{--ac:var(--violet);display:flex;align-items:center;gap:8px;padding:10px 4px 10px 2px;border-radius:15px;background:var(--well);border:1px solid var(--line)}
  .ac-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
  .bar{position:relative;height:8px;border-radius:9px;overflow:hidden;background:#162030;flex:1}
  .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 65%,transparent),var(--ac));
    box-shadow:0 0 10px color-mix(in srgb,var(--ac) 60%,transparent);transition:width .5s}

  /* ── kanban ── */
  .seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--well);border:1px solid var(--line);margin-bottom:12px}
  .seg-b{--ac:var(--mute);flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:36px;border-radius:10px;font-size:13px;font-weight:650;color:var(--faint)}
  .seg-b.on{background:#ffffff0f;color:var(--ink)}
  .seg-b .dotm{width:6px;height:6px;margin:0}
  .seg-b .n{font:600 11px var(--mono);color:var(--faint)}
  .kcols{display:grid;gap:10px}
  .kcol{border-radius:15px;min-height:60px}
  .kcol-h{display:none}
  @media(max-width:759px){
    .kb[data-sel="0"] .kcol:not([data-c="0"]),.kb[data-sel="1"] .kcol:not([data-c="1"]),.kb[data-sel="2"] .kcol:not([data-c="2"]){display:none}
  }
  @media(min-width:760px){
    .seg{display:none}
    .kcols{grid-template-columns:1fr 1fr 1fr}
    .kcol{padding:10px;background:var(--well);border:1px solid var(--line)}
    .kcol-h{display:flex;align-items:center;gap:6px;margin:0 2px 10px;font:700 10.5px var(--mono);letter-spacing:.12em;color:var(--mute)}
    .kcol .row{background:var(--panel)}
  }

  /* ── projects ── */
  .proj{--ac:var(--amber);border-radius:17px;padding:10px 12px 8px 4px;background:color-mix(in srgb,var(--ac) 5%,var(--well));
    border:1px solid color-mix(in srgb,var(--ac) 24%,transparent)}
  .proj-h{display:flex;align-items:center;gap:8px;cursor:pointer;min-height:36px}
  .proj-t{flex:1;min-width:0;font-size:15px;font-weight:620;overflow-wrap:anywhere}
  .proj-bar{display:flex;align-items:center;gap:10px;padding-left:30px}
  .proj-bar .pv{font:700 12.5px var(--mono);color:var(--ac);width:40px;text-align:right}
  .proj-x{display:flex;flex-direction:column;gap:10px;margin:8px 0 6px 30px;padding-top:12px;border-top:1px solid var(--line)}
  .lbl{font:600 10.5px var(--mono);letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
  input[type=date].inp{border-style:solid;color-scheme:dark;-webkit-appearance:none;appearance:none;display:flex;align-items:center}

  /* ── journal ── */
  .day-h{font:700 11px var(--mono);letter-spacing:.14em;color:var(--faint);text-transform:uppercase;margin:6px 2px 0}
  .entry{align-items:flex-start;padding:12px 4px 10px 12px}
  .entry .dotm{margin:7px 0 0}
  .entry .meta{display:flex;gap:8px;margin-top:4px;font:600 11.5px var(--mono)}

  /* ── stats ── */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(min-width:900px){.tiles{grid-template-columns:repeat(4,1fr)}}
  .tile{--ac:var(--cyan);padding:14px;border-radius:17px;background:color-mix(in srgb,var(--ac) 7%,var(--well));border:1px solid color-mix(in srgb,var(--ac) 22%,transparent)}
  .tile b{display:block;font:800 30px var(--mono);letter-spacing:-.03em;color:var(--ac);line-height:1.05}
  .tile span{display:block;font:600 10.5px var(--mono);letter-spacing:.12em;color:var(--mute);margin-top:6px;text-transform:uppercase}
  .heat-wrap{overflow-x:auto;scrollbar-width:none;padding:3px;margin:-3px}
  .heat-wrap::-webkit-scrollbar{display:none}
  .heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px}
  .heat-m{display:grid;grid-auto-flow:column;gap:4px;margin-bottom:6px;font:600 10px var(--mono);color:var(--faint)}
  .cell{width:100%;aspect-ratio:1;border-radius:4px;background:#151E2B;padding:0}
  .cell.l1{background:#34D39938}.cell.l2{background:#34D39970}.cell.l3{background:#34D399b8}
  .cell.l4{background:#34D399;box-shadow:0 0 8px #34D39988}
  .cell.today{outline:1.5px solid var(--ink);outline-offset:1px}
  .cell.sel{outline:2px solid var(--cyan);outline-offset:1px}
  .cell.fut{visibility:hidden}
  .legend{display:flex;align-items:center;gap:4px;font:600 11px var(--mono);color:var(--faint)}
  .legend .cell{width:12px;height:12px;display:inline-block}
  .caption{font-size:13px;color:var(--mute);min-height:18px}

  /* ── menu (more tab) ── */
  .menu{display:flex;flex-direction:column;border-radius:17px;overflow:hidden;border:1px solid var(--line);background:var(--well)}
  .mi{--ac:var(--cyan);display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 12px;text-align:left}
  .mi+.mi{border-top:1px solid var(--line)}
  .mi:active{background:#ffffff08}
  .mi-ic{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;color:var(--ac);
    background:color-mix(in srgb,var(--ac) 14%,transparent)}
  .mi-t{flex:1;font-size:15px;font-weight:600}
  .mi-t small{display:block;font-size:12.5px;font-weight:450;color:var(--faint);margin-top:1px}
  .mi>svg:last-child{color:var(--faint)}
  .foot{text-align:center;margin:26px 0 6px;font:600 11px var(--mono);letter-spacing:.14em;color:var(--faint)}

  /* ── sheet ── */
  .sheet-wrap{position:fixed;inset:0;z-index:60;display:none}
  .sheet-wrap.open{display:block}
  .scrim{position:absolute;inset:0;background:#000000a6;animation:fadeIn .2s both}
  .sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;overscroll-behavior:contain;
    padding:10px calc(16px + var(--sar)) calc(18px + var(--sab)) calc(16px + var(--sal));border-radius:24px 24px 0 0;
    background:linear-gradient(180deg,#141D2A,#0E141D);border-top:1px solid #ffffff14;animation:sheetUp .3s cubic-bezier(.2,.8,.2,1) both}
  .sheet-grab{width:40px;height:5px;border-radius:9px;background:#ffffff26;margin:0 auto 12px}
  .sheet h3{margin:2px 2px 4px;font-size:17px;font-weight:700;overflow-wrap:anywhere}
  .sheet .sheet-sub{margin:0 2px 14px;font-size:13px;color:var(--faint)}
  .sheet .menu{margin-bottom:10px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .field .inp{border-style:solid;flex:none}
  .mi.danger{--ac:var(--rose);color:var(--rose)}
  @media(min-width:760px){
    .sheet{left:50%;bottom:auto;top:50%;width:440px;border-radius:24px;border:1px solid #ffffff14;transform:translate(-50%,-50%);animation:fadeIn .2s both;padding-bottom:18px}
    .sheet-grab{display:none}
  }

  /* ── toast ── */
  .toast{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--sab) + 16px);z-index:70;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);width:max-content;padding:10px 10px 10px 16px;border-radius:15px;
    background:#1A2432f2;border:1px solid #ffffff1a;box-shadow:0 18px 40px -12px #000;font-size:14px;font-weight:550;
    transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
  .toast .btn{height:34px;padding:0 12px;font-size:13.5px}
  .toast:not(:has(.btn)){padding-right:16px}
  @media(min-width:760px){.toast{bottom:calc(96px + var(--sab))}}

  /* ── summary / print ── */
  .sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:520px){.sum-grid{grid-template-columns:1fr;gap:0}}
  .print-sheet{display:none}
  @media print{
    body{background:#fff!important;padding:0}
    .no-print,.bg-glow,.tabs,.top,#app,.sheet-wrap,.toast{display:none!important}
    .print-sheet{display:block!important}
    .print-sheet .sum-grid{grid-template-columns:1fr 1fr;gap:18px}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ───────── helpers ───────── */
/* dates are the device's local calendar day, never UTC */
function dk(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){return dk(new Date());}
function parseDay(s){var p=String(s).split("-");return new Date(+p[0],p[1]-1,+p[2]);}
function addDays(s,n){var d=parseDay(s);d.setDate(d.getDate()+n);return dk(d);}
function dayLabel(s){if(s===today())return "Today";if(s===addDays(today(),-1))return "Yesterday";
  return parseDay(s).toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"});}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]);});}
function fmt(n){return Math.floor(n/60)+":"+String(n%60).padStart(2,"0");}
function uid(p){return (p||"x")+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36);}
function same(a,b){return String(a)===String(b);}
function $(id){return document.getElementById(id);}

function isArr(x){return Array.isArray(x);}

  catch(e){if(!saveWarned){saveWarned=true;toast("⚠️ Couldn't save — storage is full or blocked. Back up from More.");}}
}

/* ───────── state ───────── */
var S=fresh(), KAN=seedKanban(), PROJ=seedProjects(), CATS=seedCats(), ENT=[], HIST=[], META={lastBackup:null};

/* backfill any fields missing from older saves or hand-edited backups */
function normalize(s){
 var f=fresh();
 ["mission","academic","nonNeg","mind","rel","optimize","suggestions","wins","losses"].forEach(function(k){if(!isArr(s[k]))s[k]=f[k];});
 if(typeof s.optimizeNote!=="string")s.optimizeNote="";

var GROUPS={
 mission:{get:function(){return S.mission;},set:function(v){S.mission=v;}},
 academic:{get:function(){return S.academic;},set:function(v){S.academic=v;}},
 nonNeg:{get:function(){return S.nonNeg;},set:function(v){S.nonNeg=v;}},

function findItem(g,id){var a=GROUPS[g]?GROUPS[g].get():[];for(var i=0;i<a.length;i++)if(same(a[i].id,id))return a[i];return null;}
function textOf(g,it){return g==="kanban"||g==="projects"?it.title:g==="journal"?it.text:it.label;}
function patch(g,id,changes){var Gp=GROUPS[g];Gp.set(Gp.get().map(function(x){return same(x.id,id)?Object.assign({},x,changes):x;}));}

/* ───────── compute / streak ───────── */
function compute(){
 var flags=[];
 CHECK_GROUPS.forEach(function(g){S[g].forEach(function(x){flags.push(!!x.done);});});
 var done=flags.filter(Boolean).length;
 var pct=flags.length?Math.round(done/flags.length*100):0;
 var ring=pct>=90?C.emerald:pct>=60?C.cyan:pct>=30?C.amber:C.rose;
 var need=Math.max(0,Math.ceil(flags.length*GOAL/100)-done);
 return{flags:flags,done:done,pct:pct,ring:ring,need:need};
}
/* keyed to S.date, the day the checklist on screen belongs to: in the seconds between midnight and the rollover it is still yesterday */
function histMap(pct){var m={};HIST.forEach(function(h){m[h.date]=h.pct;});m[S.date]=pct;return m;}
function streaks(pct){
 var m=histMap(pct);
 /* an unfinished today doesn't break the streak — it counts back from yesterday until today is met */
 var k=today();if(!(m[k]>=GOAL))k=addDays(k,-1);
 var cur=0;while(m[k]>=GOAL){cur++;k=addDays(k,-1);}
 var dates=Object.keys(m).sort(),longest=0,run=0,prev=null;
 dates.forEach(function(dt){if(m[dt]>=GOAL){run=prev&&addDays(prev,1)===dt?run+1:1;longest=Math.max(longest,run);}else run=0;prev=dt;});
 return{current:cur,longest:longest,met:pct>=GOAL};
}
function upsertToday(){var c=compute(),d=S.date;HIST=HIST.filter(function(x){return x.date!==d;})
 .concat([{date:d,pct:c.pct}]).sort(function(a,b){return a.date<b.date?-1:1;});}
function commit(){upsertToday();save();render();}
function resetDaily(src){
 var o=JSON.parse(JSON.stringify(src));o.date=today();
 CHECK_GROUPS.concat(["optimize"]).forEach(function(g){if(o[g])o[g]=o[g].map(function(x){return Object.assign({},x,{done:false});});});
 o.wins=[];o.losses=[];return o;
}

/* ───────── ui primitives ───────── */
function card(ac,inner,cls){return '<section class="card '+(cls||"")+'" style="--ac:'+ac+'">'+inner+'</section>';}

 return '<div class="ch"><span class="ch-ic">'+emoji+'</span><div><div class="ch-t">'+title+'</div>'+(sub?'<div class="ch-s">'+sub+'</div>':"")+'</div>'+
  (right!=null&&right!==""?'<span class="ch-r">'+right+'</span>':"")+'</div>';
}
function meter(done,total){return '<div class="ch-meter"><i style="width:'+(total?Math.round(done/total*100):0)+'%"></i></div>';}
function grip(){return '<span class="grip" data-a="noop" aria-hidden="true">'+I.grip+'</span>';}

 return '<div class="add"><input id="'+id+'" class="inp" data-enter="'+act+'" placeholder="'+esc(placeholder)+'" enterkeyhint="done" autocomplete="off"/>'+
  '<button class="btn" data-a="'+act+'" aria-label="'+(label||"Add")+'">'+I.plus+'</button></div>';
}
function ringSVG(pct,color,size,sw){
 var r=(size-sw)/2,circ=2*Math.PI*r,off=circ-circ*pct/100,c=size/2;
 return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="transform:rotate(-90deg);display:block" aria-hidden="true">'+
  '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="#141D2A" stroke-width="'+sw+'"/>'+
  '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+circ.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'" style="transition:stroke-dashoffset .6s cubic-bezier(.3,.8,.3,1),stroke .4s;filter:drop-shadow(0 0 6px '+color+'99)"/></svg>';
}
function emojiOf(it){return it.emoji||EMO[it.iconKey]||"";}

/* ───────── checklists ───────── */
function checkRow(g,it,color,i,numbered){
 var ac=it.color||color,on=!!it.done,e=emojiOf(it);
 var box=numbered
   ? '<span class="chk round">'+(on?I.check:(i+1))+'</span>'
   : '<span class="chk">'+I.check+'</span>';
 var timer="";
 if(it.timer&&!on){
  var running=!!UI.sil.endAt;
  timer='<div class="timer"><b id="sil-time">'+fmt(silLeft())+'</b>'+
   '<button class="tbtn" data-a="silToggle">'+(running?I.pause+" Pause":I.play+" Sit in silence")+'</button>'+
   (silLeft()<300?'<button class="tbtn" style="color:var(--faint);border-color:var(--line);background:none" data-a="silReset">Reset</button>':"")+'</div>';
 }
 return '<div class="row'+(on?" done":"")+'" style="--ac:'+ac+'" data-drop data-group="'+g+'" data-id="'+esc(it.id)+'" data-a="toggle" data-g="'+g+'" role="checkbox" aria-checked="'+on+'" tabindex="0">'+
  grip()+box+(e?'<span class="emo">'+esc(e)+'</span>':"")+
  '<div class="row-main"><span class="lb">'+esc(it.label)+'</span>'+(it.sub?'<span class="sub">'+esc(it.sub)+'</span>':"")+timer+'</div>'+
  moreBtn(g,it.id)+'</div>';
}
function checkCard(g,emoji,title,color,opts){

function heatLevel(v){return v==null||v<=0?"":v<40?"l1":v<GOAL?"l2":v<100?"l3":"l4";}

 var m=histMap(c.pct),t=today(),weeks=17;
 var start=addDays(t,-(parseDay(t).getDay()+7*(weeks-1)));
 var cells="",months="",lastM=-1;
 for(var w=0;w<weeks;w++){
  var first=parseDay(addDays(start,w*7)),mo=first.getMonth();
  /* label a month on the first week that starts in it, so the partial first column never collides */
  months+='<span>'+(mo!==lastM&&(w>0||first.getDate()<=7)?first.toLocaleDateString([],{month:"short"}):"")+'</span>';lastM=mo;
  for(var d=0;d<7;d++){
   var k=addDays(start,w*7+d),v=m[k],fut=k>t;
   cells+='<button class="cell '+heatLevel(v)+(k===t?" today":"")+(fut?" fut":"")+(UI.cell===k?" sel":"")+'" data-a="cell" data-k="'+k+'" title="'+esc(dayLabel(k))+(v!=null?" · "+v+"%":" · no data")+'" aria-label="'+esc(dayLabel(k))+'"></button>';
  }
 }
 var sel=UI.cell?(function(){var v=m[UI.cell];return '<b style="color:var(--ink)">'+esc(dayLabel(UI.cell))+'</b> · '+(v!=null?v+"% ready"+(v>=GOAL?" · counted toward streak ✓":""):"no check-in");})():"Tap a day to see its score.";
 var cols='grid-template-columns:repeat('+weeks+',minmax(14px,1fr))';
 return '<div class="heat-wrap"><div style="min-width:'+(weeks*18)+'px"><div class="heat-m" style="'+cols+'">'+months+'</div><div class="heat" style="'+cols+'">'+cells+'</div></div></div>'+
  '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap"><span class="caption">'+sel+'</span>'+
  '<span class="legend">less <span class="cell"></span><span class="cell l1"></span><span class="cell l2"></span><span class="cell l3"></span><span class="cell l4"></span> more</span></div>';
}

function dl(name,content,type){var b=new Blob([content],{type:type}),u=URL.createObjectURL(b),a=document.createElement("a");
 a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},1500);}
/* on phones the share sheet is the reliable way to save a file (a download link can strand a home-screen app) */
function shareFile(name,content,type){
 try{
  var file=new File([content],name,{type:type});
  if(IS_TOUCH&&navigator.canShare&&navigator.canShare({files:[file]}))
   return navigator.share({files:[file],title:name}).then(function(){return true;},function(e){return e&&e.name==="AbortError"?false:(dl(name,content,type),true);});
 }catch(e){}
 dl(name,content,type);return Promise.resolve(true);
}
function validBackup(d){
 if(!d||typeof d!=="object")return false;
 if(d.s!=null&&(typeof d.s!=="object"||!isArr(d.s.nonNeg)||!isArr(d.s.mind)||!isArr(d.s.rel)))return false;
 if(["kanban","projects","cats","entries","history"].some(function(k){return d[k]!=null&&!isArr(d[k]);}))return false;
 return !!(d.s||d.projects||d.entries);
}

/* data-a values can carry an argument after a colon, e.g. "add:nonNeg" or "kTo:2" */
function run(name,el,e){

}

 var di=arr.findIndex(function(x){return same(x.id,draggedId);});if(di<0)return;
 var item=Object.assign({},arr.splice(di,1)[0]);
 if(g==="kanban"&&newCat!=null&&newCat!==""){var cv=parseInt(newCat,10);if(!isNaN(cv))item.col=cv;}
 if(targetId==null){arr.push(item);}
 else{var ti=arr.findIndex(function(x){return same(x.id,targetId);});
   if(ti<0)arr.push(item);else{if(after)ti+=1;arr.splice(ti,0,item);}}
 GROUPS[g].set(arr);commit();
}
function clearMarks(){var els=document.querySelectorAll(".drop-before,.drop-after,.dragover");
 for(var i=0;i<els.length;i++)els[i].classList.remove("drop-before","drop-after","dragover");}
function dragUpdate(){
 var d=DRAG;
 d.row.style.transform="translate("+(d.x-d.x0)+"px,"+(d.y-d.y0+window.scrollY-d.sy0)+"px)";
 clearMarks();d.hit=null;
 var el=document.elementFromPoint(d.x,d.y);if(!el)return;
 var row=el.closest("[data-drop]"),zone=el.closest("[data-dropzone]");
 if(row&&row!==d.row&&row.dataset.group===d.g){
   var r=row.getBoundingClientRect(),after=d.y>r.top+r.height/2;
   row.classList.add(after?"drop-after":"drop-before");d.hit={id:row.dataset.id,after:after,cat:row.dataset.cat};
 } else if(zone&&zone.dataset.group===d.g){zone.classList.add("dragover");d.hit={id:null,after:false,cat:zone.dataset.cat};}
}
function dragEnd(apply){
 var d=DRAG;if(!d)return;DRAG=null;clearInterval(d.timer);clearMarks();
 d.row.classList.remove("dragging");d.row.style.transform="";d.row.style.pointerEvents="";
 lastDrag=Date.now();
 if(apply&&d.hit&&!(d.hit.id!=null&&same(d.hit.id,d.id)))reorder(d.g,d.id,d.hit.id,d.hit.after,d.hit.cat);
}
document.addEventListener("pointerdown",function(e){
 var h=e.target.closest(".grip");if(!h||e.button>0)return;
 var row=h.closest("[data-drop]");if(!row)return;
 e.preventDefault();
 DRAG={g:row.dataset.group,id:row.dataset.id,row:row,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,sy0:window.scrollY,hit:null};
 row.classList.add("dragging");row.style.pointerEvents="none";buzz();
 /* keep scrolling while the finger rests near the top or bottom edge */
 DRAG.timer=setInterval(function(){
   if(!DRAG)return;var y=DRAG.y,h=window.innerHeight,top=110,bot=h-(70+(parseInt(getComputedStyle(document.documentElement).getPropertyValue("--sab"))||0))-50,dy=0;
   if(y<top)dy=-Math.ceil((top-y)/5);else if(y>bot)dy=Math.ceil((y-bot)/5);
   if(dy){window.scrollBy(0,dy);dragUpdate();}
 },16);
});
document.addEventListener("pointermove",function(e){if(!DRAG)return;e.preventDefault();DRAG.x=e.clientX;DRAG.y=e.clientY;dragUpdate();},{passive:false});
document.addEventListener("pointerup",function(){dragEnd(true);});
document.addEventListener("pointercancel",function(){dragEnd(false);});
document.addEventListener("touchmove",function(e){if(DRAG)e.preventDefault();},{passive:false});

/* ───────── timers, day rollover, install ───────── */
setInterval(function(){
 if(!UI.sil.endAt)return;
 var left=silLeft(),t=$("sil-time");if(t)t.textContent=fmt(left);
 if(left<=0){UI.sil={left:0,endAt:null};S.mind=S.mind.map(function(m){return m.timer?Object.assign({},m,{done:true}):m;});
   try{if(navigator.vibrate)navigator.vibrate([60,80,60]);}catch(e){}
   commit();toast("Silence complete 🧠");}
},500);
/* a home-screen app can stay open for days — reset checklists as soon as the calendar day changes */
function checkRollover(){
 if(S.date===today())return;
 S=resetDaily(S);UI.sil={left:300,endAt:null};UI.cell=null;commit();toast("New day — checklists reset ☀️");
}
document.addEventListener("visibilitychange",function(){if(!document.hidden){checkRollover();render();}});
window.addEventListener("focus",checkRollover);
setInterval(checkRollover,30000);

var IS_IOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
var IS_TOUCH=window.matchMedia("(pointer:coarse)").matches;
var DEFERRED=null;
function isStandalone(){return window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;}
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();DEFERRED=e;render();});
window.addEventListener("appinstalled",function(){DEFERRED=null;render();});

/* ───────── init ───────── */
(function init(){
 var saved=load();
 if(saved){
   if(isArr(saved.kanban))KAN=saved.kanban;
   if(isArr(saved.projects))PROJ=saved.projects;
   if(isArr(saved.cats)&&saved.cats.length)CATS=saved.cats;
   if(isArr(saved.entries))ENT=saved.entries;
   if(saved.meta)META=Object.assign(META,saved.meta);
   /* migration: pre-v5 saves seeded fake history → clear so streaks start at 0 */
   if((saved.v||0)>=5&&isArr(saved.history))HIST=saved.history;else HIST=[];
   if(saved.s&&typeof saved.s==="object"){
     var s=normalize(saved.s);
     S=s.date!==today()?resetDaily(s):s;
   }
 }
 UI.tag=CATS[0]?CATS[0].name:"Idea";
 upsertToday();save();render();
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
 if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))
   window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
})();
})();
</script>
