<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daily Operating System</title>
<style>
  :root{
    --bg:#080B11; --panel:#0E141D; --panelHi:#131B26; --line:#1E2A38;
    --ink:#E6EDF6; --mute:#7E8CA0; --faint:#56627A;
    --cyan:#22D3EE; --violet:#A78BFA; --amber:#FBBF24;
    --emerald:#34D399; --teal:#2DD4BF; --rose:#FB7185;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  textarea,input,select{outline:none;font-family:var(--sans)}
  select{appearance:none;-webkit-appearance:none}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .fadeUp{animation:fadeUp .35s cubic-bezier(.2,.7,.3,1) both}
  .pop{animation:pop .4s cubic-bezier(.3,1.4,.5,1)}
  .rowTools{opacity:0;transition:opacity .15s}
  .hoverRow:hover .rowTools{opacity:1}
  .grip{cursor:grab;color:var(--faint);opacity:0;transition:opacity .15s;user-select:none;font-size:13px;line-height:1}
  .hoverRow:hover .grip{opacity:.8}
  .grip:active{cursor:grabbing}
  .dragover{outline:2px dashed var(--cyan)!important;outline-offset:2px}
  input[type=range]{accent-color:var(--cyan);height:4px}
  .bg-grid{position:fixed;inset:0;pointer-events:none;opacity:.5;
    background:
      radial-gradient(1100px 500px at 78% -8%, #22D3EE10, transparent 60%),
      radial-gradient(900px 500px at 12% 108%, #A78BFA10, transparent 60%),
      linear-gradient(#1E2A3822 1px, transparent 1px),
      linear-gradient(90deg,#1E2A3822 1px, transparent 1px);
    background-size:auto,auto,46px 46px,46px 46px;}
  .wrap{position:relative;max-width:1280px;margin:0 auto;padding:24px 20px}
  .grid{display:grid;gap:16px}
  .apex{grid-template-columns:1fr}
  .g12{grid-template-columns:1fr}
  .g2{grid-template-columns:1fr}
  @media(min-width:1024px){
    .apex{grid-template-columns:1fr 1fr 1fr}
    .g12{grid-template-columns:repeat(12,1fr)}
    .g2{grid-template-columns:1fr 1fr}
    .c4{grid-column:span 4}.c3{grid-column:span 3}.c6{grid-column:span 6}.c8{grid-column:span 8}.c5{grid-column:span 5}.c7{grid-column:span 7}
  }
  .tool{display:flex;align-items:center;gap:6px;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:600;transition:all .2s}
  .tool svg{width:14px;height:14px}
  @media(max-width:640px){.tool .lbl{display:none}}
  .print-sheet{display:none}
  @media print{.no-print{display:none!important}.bg-grid{display:none!important}
    .print-sheet{display:block!important}body{background:#fff!important}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg-grid no-print"></div>
<div id="print-sheet" class="print-sheet"></div>
<div id="app" class="wrap"></div>

<script>
(function(){
"use strict";
var C={bg:"#080B11",panel:"#0E141D",panelHi:"#131B26",line:"#1E2A38",ink:"#E6EDF6",mute:"#7E8CA0",faint:"#56627A",
  cyan:"#22D3EE",violet:"#A78BFA",amber:"#FBBF24",emerald:"#34D399",teal:"#2DD4BF",rose:"#FB7185"};
var PAL=[C.cyan,C.amber,C.violet,C.emerald,C.teal,C.rose,"#60A5FA","#F472B6","#A3E635","#FB923C"];
var MONO="var(--mono)", SANS="var(--sans)";
var GOAL=80;
var QUOTES=[
 "Consistency compounds. The boring days are where the edge is built.",
 "You don't rise to your goals — you fall to the level of your daily systems.",
 "Show up on the day you least feel like it. That one counts double.",
 "Small, repeated, on purpose. That's the whole secret.",
 "The streak isn't about perfection. It's about never letting two days slip.",
 "Discipline now is freedom later. Pay it forward to your future self.",
 "Motivation gets you started. The protocol keeps you going.",
 "Every checkbox is a vote for the person you're becoming."
];
var EMO={moon:"🌙",dumbbell:"💪",droplets:"🚿",zap:"⚡",headphones:"🎧",brain:"🧠",book:"📖",heart:"❤️",
  game:"🎮",clap:"🎬",music:"🎸",fish:"🐟",dot:"•",target:"🎯",grad:"🎓",box:"🧱",phone:"📱",
  trophy:"🏆",down:"📉",bulb:"💡",spark:"✨",flame:"🔥",activity:"📊",rocket:"🚀"};
var STATUS={Idea:C.violet,Active:C.amber,"On Hold":C.rose,Shipped:C.emerald};

function svg(p,sz){sz=sz||14;return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
var G={
  chevL:svg('<polyline points="15 18 9 12 15 6"/>',13),
  chevR:svg('<polyline points="9 18 15 12 9 6"/>',13),
  chevD:svg('<polyline points="6 9 12 15 18 9"/>',14),
  plus:svg('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',13),
  minus:svg('<line x1="5" y1="12" x2="19" y2="12"/>',13),
  pencil:svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',12),
  trash:svg('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/>',12),
  play:svg('<polygon points="6 4 20 12 6 20 6 4"/>',11),
  pause:svg('<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',11),
  refresh:svg('<polyline points="23 4 23 10 17 10"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/>',11),
  printer:svg('<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>'),
  download:svg('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>'),
  upload:svg('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>'),
  reset:svg('<polyline points="1 4 1 10 7 10"/><path d="M3.5 15a9 9 0 1 0 2.1-9.4L1 10"/>'),
  eye:svg('<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>'),
  dash:svg('<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>')
};

function dk(d){return d.toISOString().slice(0,10);}
function today(){return dk(new Date());}
function addDays(s,n){var d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return dk(d);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]);});}
function attr(s){return String(s==null?"":s).replace(/"/g,"&quot;");}
function fmt(n){return Math.floor(n/60)+":"+String(n%60).padStart(2,"0");}
function uid(p){return (p||"x")+Date.now()+Math.floor(Math.random()*999);}

var KEY="dailyos:v4";
function save(){try{localStorage.setItem(KEY,JSON.stringify({v:5,s:S,kanban:KAN,projects:PROJ,cats:CATS,entries:ENT,history:HIST}));}catch(e){}}
function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return null;}}

/* ───────── seeds ───────── */
function fresh(){return{
 date:today(),
 mission:[{id:"ms1",iconKey:"target",label:"Improve at AbaData — one concrete move forward",sub:"primary daily mission",done:false}],
 academic:[{id:"ac1",label:"GT OMSCS progression",value:35,color:C.violet},{id:"ac2",label:"MIT xPRO · Quantum Computing",value:20,color:C.cyan}],
 nonNeg:[
  {id:"n1",iconKey:"moon",label:"8–9 hours of sleep",sub:"",done:false},
  {id:"n2",iconKey:"dumbbell",label:"PhysicalBlueprint workout",sub:"follow the health guide",done:false},
  {id:"n3",iconKey:"droplets",label:"Daily hygiene protocols",sub:"",done:false},
  {id:"n4",iconKey:"zap",label:"Do not waste time",sub:"",done:false},
  {id:"n5",iconKey:"phone",label:"Social media — stay within 10 min",sub:"don't back out of the phone's timer",done:false}
 ],
 mind:[
  {id:"m1",iconKey:"headphones",label:'Listen to "the 1" audio',sub:"the daily input",done:false},
  {id:"m2",iconKey:"brain",label:"5–10 min silent thought",sub:"immediately after the audio",done:false,timer:true},
  {id:"m3",iconKey:"book",label:"Read 30 min before bed",sub:"put yourself to sleep",done:false}
 ],
 rel:[
  {id:"r1",iconKey:"heart",color:C.rose,label:"Quality time with Julia",sub:"talk & connect",done:false},
  {id:"r2",iconKey:"game",color:C.amber,label:"Markiplier / PewDiePie",sub:"only when alone, after work",done:false},
  {id:"r3",iconKey:"clap",color:C.violet,label:"Media control held",sub:"only w/ Julia — or a rare 4K indulgence",done:false},
  {id:"r4",iconKey:"fish",color:C.cyan,label:"Sturgeon gear / time prep",sub:"shore-based optimization",done:false}
 ],
 wins:[], losses:[],
 optimizeNote:"",
 optimize:[
  {id:"o1",label:"Trim one time-waster from the day",done:false},
  {id:"o2",label:"Sharpen one system / workflow",done:false}
 ],
 suggestions:[]
};}
function seedKanban(){return[
 {id:1,title:"Base map + OSM tile layer",col:2},
 {id:2,title:"Custom GeoJSON layer styling",col:1},
 {id:3,title:"Draw tools → log sturgeon spots",col:0},
 {id:4,title:"Marker clustering + rich popups",col:0}
];}
function seedProjects(){return[
 {id:101,title:"KnoppMap (Leaflet GIS app)",status:"Active",progress:40,start:"",notes:"Custom Leaflet.js GIS mapping application.",expanded:false},
 {id:102,title:"Project Sturgeon",status:"Active",progress:20,start:"",notes:"Shore-based sturgeon fishing — gear, spots, logs.",expanded:false},
 {id:103,title:"IBM Quantum Cert",status:"Active",progress:15,start:"",notes:"",expanded:false},
 {id:104,title:"EurekaBitz",status:"Idea",progress:5,start:"",notes:"",expanded:false},
 {id:105,title:"Project Alexandria",status:"Idea",progress:0,start:"",notes:"",expanded:false},
 {id:106,title:"Book",status:"Idea",progress:0,start:"",notes:"",expanded:false},
 {id:107,title:"Quantum AbaData Project",status:"Idea",progress:0,start:"",notes:"",expanded:false},
 {id:108,title:"Guitar — practice & learn",status:"Active",progress:25,start:"",notes:"Practice routine, songs, theory.",expanded:false}
];}
function seedCats(){return[{id:"c1",name:"Idea",color:C.cyan},{id:"c2",name:"Productivity",color:C.amber},{id:"c3",name:"Creativity",color:C.violet}];}
var S=fresh(), KAN=seedKanban(), PROJ=seedProjects(), CATS=seedCats(), ENT=[], HIST=[];
var UI={view:"control",quote:new Date().getDate()%QUOTES.length,tag:"Idea",draft:"",edit:null,
        sil:{left:300,running:false},flash:null,addingCat:false,col:{}};
var DND=null;
var saveTimer=null;
function debouncedSave(){clearTimeout(saveTimer);saveTimer=setTimeout(save,400);}

/* ───────── group registry (for drag/reorder) ───────── */
var GROUPS={
 mission:{get:function(){return S.mission;},set:function(v){S.mission=v;}},
 academic:{get:function(){return S.academic;},set:function(v){S.academic=v;}},
 nonNeg:{get:function(){return S.nonNeg;},set:function(v){S.nonNeg=v;}},
 mind:{get:function(){return S.mind;},set:function(v){S.mind=v;}},
 rel:{get:function(){return S.rel;},set:function(v){S.rel=v;}},
 wins:{get:function(){return S.wins;},set:function(v){S.wins=v;}},
 losses:{get:function(){return S.losses;},set:function(v){S.losses=v;}},
 optimize:{get:function(){return S.optimize;},set:function(v){S.optimize=v;}},
 suggestions:{get:function(){return S.suggestions;},set:function(v){S.suggestions=v;}},
 projects:{get:function(){return PROJ;},set:function(v){PROJ=v;}},
 kanban:{get:function(){return KAN;},set:function(v){KAN=v;},cat:"col",catNum:true},
 journal:{get:function(){return ENT;},set:function(v){ENT=v;}}
};

/* ───────── compute / streak ───────── */
function compute(){
 var flags=[];
 S.mission.forEach(function(x){flags.push(x.done);});
 S.nonNeg.forEach(function(x){flags.push(x.done);});
 S.mind.forEach(function(x){flags.push(x.done);});
 S.rel.forEach(function(x){flags.push(x.done);});
 var done=flags.filter(Boolean).length;
 var pct=flags.length?Math.round(done/flags.length*100):0;
 var ring=pct>=90?C.emerald:pct>=60?C.cyan:pct>=30?C.amber:C.rose;
 return{flags:flags,done:done,pct:pct,ring:ring};
}
function streaks(pct){
 var m={};HIST.forEach(function(h){m[h.date]=h.pct;});m[today()]=pct;
 var cur=0,k=today();while(m[k]!==undefined&&m[k]>=GOAL){cur++;k=addDays(k,-1);}
 var dates=Object.keys(m).sort(),longest=0,run=0,prev=null;
 dates.forEach(function(dt){if(m[dt]>=GOAL){run=prev&&addDays(prev,1)===dt?run+1:1;longest=Math.max(longest,run);}else run=0;prev=dt;});
 return{current:cur,longest:longest};
}
function upsertToday(){var c=compute();HIST=HIST.filter(function(x){return x.date!==today();})
 .concat([{date:today(),pct:c.pct}]).sort(function(a,b){return a.date<b.date?-1:1;});}
function commit(){upsertToday();save();render();}
function resetDaily(src){
 var o=JSON.parse(JSON.stringify(src));o.date=today();
 ["mission","nonNeg","mind","rel","optimize"].forEach(function(g){if(o[g])o[g]=o[g].map(function(x){return Object.assign({},x,{done:false});});});
 o.wins=[];o.losses=[];return o;
}

/* ───────── shared bits ───────── */
function grip(group,id){return '<span class="grip" draggable="true" data-group="'+group+'" data-id="'+id+'" title="drag to reorder">⠿</span>';}
function panel(accent,inner,extra){
 return '<section style="position:relative;border-radius:16px;background:linear-gradient(180deg,'+C.panelHi+','+C.panel+');border:1px solid '+C.line+';box-shadow:0 1px 0 0 #ffffff08 inset,0 18px 40px -28px '+accent+'55;'+(extra||"")+'">'+
  '<span style="position:absolute;top:0;left:18px;right:18px;height:1px;background:linear-gradient(90deg,transparent,'+accent+'66,transparent)"></span>'+
  '<div style="padding:20px">'+inner+'</div></section>';
}
function eyebrow(emoji,label,color,right){
 return '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">'+
  '<div style="display:flex;align-items:center;gap:10px">'+
   '<span style="display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;font-size:14px;background:'+color+'1A;border:1px solid '+color+'33">'+emoji+'</span>'+
   '<span style="font-family:'+MONO+';font-size:11px;letter-spacing:.18em;color:'+C.mute+';text-transform:uppercase;font-weight:600">'+label+'</span>'+
  '</div>'+(right||"")+'</div>';
}
function sectionLabel(emoji,color,text,key){
 var collapsed=UI.col[key];
 return '<div onclick="DOS.collapse(\''+key+'\')" style="display:flex;align-items:center;gap:8px;margin:14px 0 12px;padding:0 4px;cursor:pointer;user-select:none">'+
  '<span style="display:inline-flex;transition:transform .2s;transform:rotate('+(collapsed?-90:0)+'deg);color:'+C.faint+'">'+G.chevD+'</span>'+
  '<span style="font-size:14px">'+emoji+'</span>'+
  '<h2 style="margin:0;font-family:'+MONO+';font-size:12px;letter-spacing:.22em;color:'+C.mute+';font-weight:700">'+text+'</h2>'+
  '<div style="flex:1;height:1px;background:linear-gradient(90deg,'+C.line+',transparent)"></div></div>';
}
function checkSVG(on,color){
 return '<span style="position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0;width:24px;height:24px;border-radius:6px;background:'+(on?color:"transparent")+';border:2px solid '+(on?color:C.faint)+';box-shadow:'+(on?"0 0 14px "+color+"88":"none")+'">'+
  '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 12.5 L10 18 L20 5" stroke="'+C.bg+'" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:30;stroke-dashoffset:'+(on?0:30)+';transition:stroke-dashoffset .35s cubic-bezier(.65,0,.35,1)"/></svg></span>';
}
function progressBar(value,color){
 return '<div style="position:relative;flex:1;border-radius:99px;overflow:hidden;height:8px;background:#0A0F16">'+
  '<div style="height:100%;border-radius:99px;transition:width .5s;width:'+value+'%;background:linear-gradient(90deg,'+color+'AA,'+color+');box-shadow:0 0 10px '+color+'99"></div></div>';
}

/* ───────── checklist (mission/nonNeg/mind/rel) ───────── */
function listRow(group,it,color,opts,index){
 opts=opts||{};
 var ac=it.color||color, on=it.done, numbered=opts.numbered;
 var editing=UI.edit&&UI.edit.kind==="item"&&UI.edit.group===group&&UI.edit.id===it.id;
 var marker = numbered
   ? '<button onclick="DOS.toggle(\''+group+'\',\''+it.id+'\')" style="position:absolute;left:-28px;top:10px;display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:99px;background:'+(on?ac:C.panel)+';border:2px solid '+(on?ac:C.faint)+';box-shadow:'+(on?"0 0 12px "+ac+"99":"none")+'">'+(on?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M4 12.5 L10 18 L20 5" stroke="'+C.bg+'" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>':'<span style="font-family:'+MONO+';font-size:10px;color:'+C.faint+'">'+(index+1)+'</span>')+'</button>'
   : '<button onclick="DOS.toggle(\''+group+'\',\''+it.id+'\')" style="background:none;border:none;padding:0">'+checkSVG(on,ac)+'</button>';
 var labelHtml = editing
   ? '<input id="editbox" value="'+attr(it.label)+'" onkeydown="DOS.editKey(event)" onblur="DOS.commitEdit()" style="width:100%;border-radius:6px;padding:4px 8px;font-size:14px;background:#0A0F16;border:1px solid '+ac+'55;color:'+C.ink+'"/>'
   : '<span style="display:block;font-size:14px;font-weight:500;color:'+(on?C.mute:C.ink)+';text-decoration:'+(on?"line-through":"none")+';text-decoration-color:'+ac+'">'+esc(it.label)+'</span>'+
     (it.sub?'<span style="display:block;font-size:12px;margin-top:2px;color:'+C.faint+';font-family:'+MONO+'">'+esc(it.sub)+'</span>':"");
 var extra="";
 if(it.timer&&!on){
   extra='<div style="margin-top:8px;display:flex;align-items:center;gap:8px">'+
    '<span id="sil-time" style="font-weight:700;font-size:14px;font-family:'+MONO+';color:'+C.teal+'">'+fmt(UI.sil.left)+'</span>'+
    '<button onclick="DOS.silToggle()" style="display:flex;align-items:center;gap:4px;border-radius:6px;padding:4px 8px;font-size:12px;font-weight:600;border:1px solid '+C.teal+'55;color:'+C.teal+';background:none">'+(UI.sil.running?G.pause+" pause":G.play+" sit in silence")+'</button>'+
    (UI.sil.left<300?'<button onclick="DOS.silReset()" style="font-size:12px;color:'+C.faint+';font-family:'+MONO+';background:none;border:none">reset</button>':"")+'</div>';
 }
 return '<div class="hoverRow" data-drop data-group="'+group+'" data-id="'+it.id+'" style="position:relative">'+(numbered?marker:"")+
  '<div style="display:flex;align-items:center;gap:8px;border-radius:12px;padding:10px 12px;background:'+(on?ac+"10":"transparent")+';border:1px solid '+(on?ac+"44":C.line)+'">'+
   grip(group,it.id)+
   (numbered?"":marker)+
   (opts.hideIcon?"":'<span style="font-size:15px;flex-shrink:0;filter:'+(on?"none":"grayscale(.3) opacity(.75)")+'">'+(EMO[it.iconKey]||"•")+'</span>')+
   '<div style="min-width:0;flex:1">'+labelHtml+extra+'</div>'+
   '<div class="rowTools" style="display:flex;align-items:center;gap:2px">'+
    '<button onclick="DOS.startEdit(\'item\',\''+group+'\',\''+it.id+'\')" style="color:'+C.faint+';background:none;border:none;padding:4px">'+G.pencil+'</button>'+
    '<button onclick="DOS.del(\''+group+'\',\''+it.id+'\')" style="color:'+C.faint+';background:none;border:none;padding:4px">'+G.trash+'</button>'+
   '</div></div></div>';
}
function listBlock(group,color,items,opts){
 opts=opts||{};var numbered=opts.numbered;
 var rows=items.map(function(it,i){return listRow(group,it,color,opts,i);}).join("");
 var indent=numbered?'margin-left:-28px;width:calc(100% + 28px);':"";
 var add='<div style="margin-top:8px;display:flex;gap:6px;'+indent+'">'+

 if(c)c.textContent=n.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"});

/* ───────── drag & drop ───────── */
function reorder(group,draggedId,targetId,after,newCat){
 var Gp=GROUPS[group];if(!Gp)return;var arr=Gp.get().slice();
 var di=arr.findIndex(function(x){return String(x.id)===String(draggedId);});if(di<0)return;
 var item=arr.splice(di,1)[0];
 if(newCat!=null&&Gp.cat){var cv=Gp.catNum?parseInt(newCat,10):newCat;if(!(Gp.catNum&&isNaN(cv)))item[Gp.cat]=cv;}
 if(targetId==null){arr.push(item);}
 else{var ti=arr.findIndex(function(x){return String(x.id)===String(targetId);});
   if(ti<0)arr.push(item);else{if(after)ti+=1;arr.splice(ti,0,item);}}
 Gp.set(arr);commit();
}
document.addEventListener("dragstart",function(e){
 var h=e.target.closest('[draggable="true"]');if(!h)return;
 var src=h.dataset.group?h:h.closest("[data-group]");if(!src)return;
 DND={group:src.dataset.group,id:src.dataset.id};
 try{e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",src.dataset.id);}catch(_){}
});
document.addEventListener("dragend",function(){DND=null;var els=document.querySelectorAll(".dragover");for(var i=0;i<els.length;i++)els[i].classList.remove("dragover");});
document.addEventListener("dragover",function(e){
 if(!DND)return;var z=e.target.closest('[data-drop],[data-dropzone]');if(!z||z.dataset.group!==DND.group)return;e.preventDefault();
});
document.addEventListener("drop",function(e){
 if(!DND)return;var row=e.target.closest("[data-drop]"),zone=e.target.closest("[data-dropzone]");
 var g=DND.group,id=DND.id;
 if(row&&row.dataset.group===g){
   if(String(row.dataset.id)===String(id)){DND=null;return;}
   var r=row.getBoundingClientRect();var after=e.clientY>r.top+r.height/2;
   reorder(g,id,row.dataset.id,after,row.dataset.cat);
 } else if(zone&&zone.dataset.group===g){
   reorder(g,id,null,false,zone.dataset.cat);
 }
 DND=null;
});

   r.onload=function(){try{var d=JSON.parse(r.result);if(d.s)S=d.s;if(d.kanban)KAN=d.kanban;if(d.projects)PROJ=d.projects;if(d.cats)CATS=d.cats;if(d.entries)ENT=d.entries;if(d.history)HIST=d.history;
     if((d.version||0)<5)HIST=[];
     if(!S.optimize)S.optimize=[];if(!S.suggestions)S.suggestions=[];if(!S.mission)S.mission=fresh().mission;if(!S.academic)S.academic=fresh().academic;if(!S.wins)S.wins=[];if(!S.losses)S.losses=[];
     commit();}catch(e){alert("Couldn't read that backup file.");}};
   r.readAsText(f);input.value="";}
};

/* ───────── init ───────── */
(function init(){
 var saved=load();
 if(saved){
   if(saved.kanban)KAN=saved.kanban;
   if(saved.projects)PROJ=saved.projects;
   if(saved.cats)CATS=saved.cats;
   if(saved.entries)ENT=saved.entries;
   /* migration: pre-v5 saves seeded fake history → clear so streaks start at 0 */
   if((saved.v||0)>=5 && saved.history)HIST=saved.history;else HIST=[];
   if(saved.s){
     var s=saved.s;
     /* backfill any new fields for older saves */
     var f=fresh();["mission","academic","optimize","suggestions","wins","losses"].forEach(function(k){if(!s[k])s[k]=f[k];});
     if(s.optimizeNote==null)s.optimizeNote="";
     S = s.date!==today() ? resetDaily(s) : s;
   }
   if(CATS&&CATS.length)UI.tag=CATS[0].name;
 }
 upsertToday();save();render();
})();
})();
</script>
